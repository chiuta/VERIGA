name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etichetă de lansare (ex. v1.0.0-alpha.1): creează eticheta și lansarea; cu sufix = ciornă + pre-lansare"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1"   # audit săptămânal al dependențelor (advisories noi)

# Permisiuni minime implicite; joburile care au nevoie de mai mult le cer explicit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # rularea de release (tag sau dispatch cu release_tag) nu se anulează la un push ulterior
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log || {
            # rezumatul eșecurilor devine adnotare (vizibilă și fără accesul la jurnal)
            msg=$(grep -E "^test .*FAILED|panicked at|^---- |assertion|left:|right:|error(\[|:)" test.log | head -25 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=cargo test::${msg}"
            exit 1
          }

  msrv:
    # core + CLI trebuie să compileze pe versiunea minimă declarată (rust-version)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p veriga-core -p veriga-cli --locked

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: web/tests } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee web.log || {
            msg=$(grep -E "EXCEP|Error|FAIL|nu a |lipsește|eșec|EȘEC|✗|not ok" web.log | head -15 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=npm test::${msg}"
            exit 1
          }
      - name: CSP actualizat?
        working-directory: .
        run: |
          python3 web/stamp-csp.py web/veriga.html
          git diff --exit-code web/veriga.html
          python3 web/stamp-site-csp.py index.html --check
      - name: PWA la zi?
        working-directory: .
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 web/build-pwa.py --check

  build:
    needs: [lint, test, msrv, supply-chain, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (GUI + CLI, glibc)
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,    pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,   pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          # Linux (CLI static, musl) — rulează pe orice distribuție, inclusiv Alpine/containere
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl,   pkgs: "-p veriga-cli", ext: tar.gz, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,  pkgs: "-p veriga-cli", ext: tar.gz, musl: true }
          # Windows
          - { os: windows-2025,     target: x86_64-pc-windows-msvc,      pkgs: "-p veriga-cli -p veriga-gui", ext: zip }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,     pkgs: "-p veriga-cli -p veriga-gui", ext: zip }
          # macOS
          - { os: macos-15-intel,   target: x86_64-apple-darwin,         pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          - { os: macos-15,         target: aarch64-apple-darwin,        pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -t ${{ matrix.target }} && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.pkgs }}
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          d=veriga-${{ matrix.target }}
          mkdir "$d"
          cp target/${{ matrix.target }}/release/veriga "$d"/
          [ -f target/${{ matrix.target }}/release/veriga-gui ] && cp target/${{ matrix.target }}/release/veriga-gui "$d"/
          cp README.md LICENSE SECURITY.md web/veriga.html "$d"/
          tar czf "$d.tar.gz" "$d"
      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $d = "veriga-${{ matrix.target }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/veriga.exe" $d
          Copy-Item "target/${{ matrix.target }}/release/veriga-gui.exe" $d
          Copy-Item README.md, LICENSE, SECURITY.md, web/veriga.html $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: veriga-${{ matrix.target }}
          path: veriga-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  portable:
    # pachet PortableApps.com Format 3.9: lansator Rust + arhivele Windows x64/ARM64
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p veriga-launcher
      - run: cargo build --release --locked -p veriga-launcher
      - uses: actions/download-artifact@v8
        with: { path: in, pattern: "veriga-*-pc-windows-msvc", merge-multiple: true }
      - name: Asamblează și validează
        shell: bash
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          python portableapps/build.py --launcher target/release/VERIGAPortable.exe \
            --x64 in/veriga-x86_64-pc-windows-msvc.zip --arm64 in/veriga-aarch64-pc-windows-msvc.zip \
            --out "dist/VERIGAPortable_${ver}_Multilingual.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: VERIGAPortable
          path: dist/*.zip
          if-no-files-found: error

  packaging:
    # verificări statice ale pachetelor (YunoHost, Termux, K8s, compose) + .deb/.rpm construite nativ pe fiecare arhitectură
    # (rpmbuild din Ubuntu nu face cross-build pentru altă arhitectură)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl,  rpmarch: x86_64,  debarch: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, rpmarch: aarch64, debarch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Verificări statice
        run: |
          python3 packaging/yunohost/check.py
          sh -n packaging/termux/install.sh
          python3 -m pip install --break-system-packages pyyaml
          python3 -c "import yaml,sys; [list(yaml.safe_load_all(open(f))) for f in ('packaging/k8s/cronjob.yaml','packaging/docker/docker-compose.yml')]"
          python3 -c "import json; json.load(open('packaging/systemd/guardian.example.json'))"
      - uses: actions/download-artifact@v8
        with: { path: in, name: "veriga-${{ matrix.target }}" }
      - name: Construiește .deb și .rpm
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          ver=$(sed -n 's/^version = "\([0-9][0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          t=${{ matrix.target }}
          tar xzf in/veriga-$t.tar.gz -C in
          packaging/deb/build.sh "$ver" "$t" "in/veriga-$t/veriga" dist
          ls -l dist
      - name: Instalează și rulează .deb (nativ)
        run: |
          sudo dpkg -i dist/veriga_*_${{ matrix.debarch }}.deb
          veriga --version
          test -f /usr/lib/systemd/system/veriga-watch.timer
          sudo mkdir -p /etc/veriga && sudo cp packaging/systemd/guardian.example.json /etc/veriga/guardian.json
          systemd-analyze verify /usr/lib/systemd/system/veriga-watch.service /usr/lib/systemd/system/veriga-watch.timer
          sudo dpkg -r veriga
      - name: Verifică .rpm
        run: |
          ls dist/veriga-*.${{ matrix.rpmarch }}.rpm
          rpm -qpi dist/veriga-*.${{ matrix.rpmarch }}.rpm | grep -E "^(Name|Version|Architecture)"
          rpm -qpl dist/veriga-*.${{ matrix.rpmarch }}.rpm | grep -c . 
      - uses: actions/upload-artifact@v7
        with: { name: "packages-${{ matrix.debarch }}", path: dist/*, if-no-files-found: error }

  docker:
    # imagine multi-arch (amd64+arm64) din binarele musl; publicată pe GHCR doar la lansări
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { path: in, pattern: "veriga-*-unknown-linux-musl", merge-multiple: true }
      - name: Pregătește binarele
        run: |
          mkdir -p ctx/bin/amd64 ctx/bin/arm64
          tar xzf in/veriga-x86_64-unknown-linux-musl.tar.gz -C in && cp in/veriga-x86_64-unknown-linux-musl/veriga ctx/bin/amd64/
          tar xzf in/veriga-aarch64-unknown-linux-musl.tar.gz -C in && cp in/veriga-aarch64-unknown-linux-musl/veriga ctx/bin/arm64/
      - name: Construiește și încearcă imaginea (amd64)
        run: |
          docker buildx build --load --platform linux/amd64 -f packaging/docker/Dockerfile.release -t veriga:test ctx
          docker run --rm veriga:test --version
          test "$(docker image inspect veriga:test --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --read-only --cap-drop ALL veriga:test --help | head -3
      - name: Publică pe GHCR (multi-arch)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env: { TAG: "${{ inputs.release_tag || github.ref_name }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::etichetă invalidă"; exit 1 ;; esac
          ver=${TAG#v}
          cv=$(sed -n 's/^version = "\([0-9][0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          case "$TAG" in "v$cv"|"v$cv-"*) ;; *) echo "::error::eticheta $TAG nu corespunde versiunii $cv din Cargo.toml (nimic nu a fost publicat)"; exit 1 ;; esac
          repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/veriga
          docker buildx create --name multi --driver docker-container --use   # multi-platform + atestări cer driverul docker-container
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tags="-t $repo:$ver"
          case "$TAG" in *-*) ;; *) tags="$tags -t $repo:latest" ;; esac   # `latest` doar pentru versiuni finale
          docker buildx build --push --platform linux/amd64,linux/arm64 --build-arg VERSION="$ver" \
            --provenance=true --sbom=true -f packaging/docker/Dockerfile.release $tags ctx

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, portable, packaging, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # creează release-ul
      id-token: write        # semnare Sigstore pentru atestare
      attestations: write    # proveniență (SLSA) pentru artefacte
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Eticheta trebuie să corespundă versiunii din Cargo.toml
        env: { TAG: "${{ inputs.release_tag || github.ref_name }}" }
        run: |
          ver=$(sed -n 's/^version = "\([0-9][0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          case "$TAG" in "v$ver"|"v$ver-"*) echo "eticheta $TAG corespunde versiunii $ver" ;; *) echo "::error::eticheta $TAG nu corespunde versiunii $ver din Cargo.toml"; exit 1 ;; esac
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Sume de control
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "dist/*" }
      - name: Publică release (fără acțiuni terțe)
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.release_tag || github.ref_name }}" }
        run: |
          # etichetele cu sufix (v1.0.0-alpha.1) devin ciornă + pre-lansare; le publici tu după verificare
          tag="$TAG"
          case "$tag" in v[0-9]*) ;; *) echo "::error::eticheta trebuie să înceapă cu v și o cifră"; exit 1 ;; esac
          flags=""
          case "$tag" in *-*) flags="--draft --prerelease" ;; esac
          gh release create "$tag" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --generate-notes $flags
