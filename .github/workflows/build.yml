name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # audit săptămânal al dependențelor (advisories noi)

# Permisiuni minime implicite; joburile care au nevoie de mai mult le cer explicit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    # core + CLI trebuie să compileze pe versiunea minimă declarată (rust-version)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p veriga-core -p veriga-cli --locked

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: web/tests } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: CSP actualizat?
        working-directory: .
        run: |
          python3 web/stamp-csp.py web/veriga.html
          git diff --exit-code web/veriga.html

  build:
    needs: [lint, test, msrv, supply-chain, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (GUI + CLI, glibc)
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,    pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,   pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          # Linux (CLI static, musl) — rulează pe orice distribuție, inclusiv Alpine/containere
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl,   pkgs: "-p veriga-cli", ext: tar.gz, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,  pkgs: "-p veriga-cli", ext: tar.gz, musl: true }
          # Windows
          - { os: windows-2025,     target: x86_64-pc-windows-msvc,      pkgs: "-p veriga-cli -p veriga-gui", ext: zip }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,     pkgs: "-p veriga-cli -p veriga-gui", ext: zip }
          # macOS
          - { os: macos-15-intel,   target: x86_64-apple-darwin,         pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          - { os: macos-15,         target: aarch64-apple-darwin,        pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -t ${{ matrix.target }} && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.pkgs }}
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          d=veriga-${{ matrix.target }}
          mkdir "$d"
          cp target/${{ matrix.target }}/release/veriga "$d"/
          [ -f target/${{ matrix.target }}/release/veriga-gui ] && cp target/${{ matrix.target }}/release/veriga-gui "$d"/
          cp README.md LICENSE-MIT LICENSE-APACHE SECURITY.md web/veriga.html "$d"/
          tar czf "$d.tar.gz" "$d"
      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $d = "veriga-${{ matrix.target }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/veriga.exe" $d
          Copy-Item "target/${{ matrix.target }}/release/veriga-gui.exe" $d
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, SECURITY.md, web/veriga.html $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: veriga-${{ matrix.target }}
          path: veriga-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # creează release-ul
      id-token: write        # semnare Sigstore pentru atestare
      attestations: write    # proveniență (SLSA) pentru artefacte
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Sume de control
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "dist/*" }
      - name: Publică release (fără acțiuni terțe)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
