name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etichetă de lansare (ex. v1.0.0-alpha.1): creează eticheta și lansarea; cu sufix = ciornă + pre-lansare"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * 1"   # audit săptămânal al dependențelor (advisories noi)

# Permisiuni minime implicite; joburile care au nevoie de mai mult le cer explicit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # rularea de release (tag sau dispatch cu release_tag) nu se anulează la un push ulterior
  cancel-in-progress: ${{ !(startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log || {
            # rezumatul eșecurilor devine adnotare (vizibilă și fără accesul la jurnal)
            msg=$(grep -E "^test .*FAILED|panicked at|^---- |assertion|left:|right:|error(\[|:)" test.log | head -25 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=cargo test::${msg}"
            exit 1
          }

  msrv:
    # core + CLI trebuie să compileze pe versiunea minimă declarată (rust-version)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p veriga-core -p veriga-cli --locked

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: web/tests } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee web.log || {
            msg=$(grep -E "EXCEP|Error|FAIL|nu a |lipsește|eșec|EȘEC|✗|not ok" web.log | head -15 | tr '\n' '|' | cut -c1-1500)
            echo "::error title=npm test::${msg}"
            exit 1
          }
      - name: CSP actualizat?
        working-directory: .
        run: |
          python3 web/stamp-csp.py web/veriga.html
          git diff --exit-code web/veriga.html
          python3 web/stamp-site-csp.py index.html --check

  build:
    needs: [lint, test, msrv, supply-chain, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (GUI + CLI, glibc)
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,    pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,   pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          # Linux (CLI static, musl) — rulează pe orice distribuție, inclusiv Alpine/containere
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl,   pkgs: "-p veriga-cli", ext: tar.gz, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,  pkgs: "-p veriga-cli", ext: tar.gz, musl: true }
          # Windows
          - { os: windows-2025,     target: x86_64-pc-windows-msvc,      pkgs: "-p veriga-cli -p veriga-gui", ext: zip }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,     pkgs: "-p veriga-cli -p veriga-gui", ext: zip }
          # macOS
          - { os: macos-15-intel,   target: x86_64-apple-darwin,         pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
          - { os: macos-15,         target: aarch64-apple-darwin,        pkgs: "-p veriga-cli -p veriga-gui", ext: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -t ${{ matrix.target }} && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.pkgs }}
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          d=veriga-${{ matrix.target }}
          mkdir "$d"
          cp target/${{ matrix.target }}/release/veriga "$d"/
          [ -f target/${{ matrix.target }}/release/veriga-gui ] && cp target/${{ matrix.target }}/release/veriga-gui "$d"/
          cp README.md LICENSE SECURITY.md web/veriga.html "$d"/
          tar czf "$d.tar.gz" "$d"
      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $d = "veriga-${{ matrix.target }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/veriga.exe" $d
          Copy-Item "target/${{ matrix.target }}/release/veriga-gui.exe" $d
          Copy-Item README.md, LICENSE, SECURITY.md, web/veriga.html $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: veriga-${{ matrix.target }}
          path: veriga-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  portable:
    # pachet PortableApps.com Format 3.9: lansator Rust + arhivele Windows x64/ARM64
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p veriga-launcher
      - run: cargo build --release --locked -p veriga-launcher
      - uses: actions/download-artifact@v8
        with: { path: in, pattern: "veriga-*-pc-windows-msvc", merge-multiple: true }
      - name: Asamblează și validează
        shell: bash
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          python portableapps/build.py --launcher target/release/VERIGAPortable.exe \
            --x64 in/veriga-x86_64-pc-windows-msvc.zip --arm64 in/veriga-aarch64-pc-windows-msvc.zip \
            --out "dist/VERIGAPortable_${ver}_Multilingual.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: VERIGAPortable
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # creează release-ul
      id-token: write        # semnare Sigstore pentru atestare
      attestations: write    # proveniență (SLSA) pentru artefacte
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Eticheta trebuie să corespundă versiunii din Cargo.toml
        env: { TAG: "${{ inputs.release_tag || github.ref_name }}" }
        run: |
          ver=$(sed -n 's/^version = "\([0-9][0-9.]*\)".*/\1/p' Cargo.toml | head -1)
          case "$TAG" in "v$ver"|"v$ver-"*) echo "eticheta $TAG corespunde versiunii $ver" ;; *) echo "::error::eticheta $TAG nu corespunde versiunii $ver din Cargo.toml"; exit 1 ;; esac
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Sume de control
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "dist/*" }
      - name: Publică release (fără acțiuni terțe)
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.release_tag || github.ref_name }}" }
        run: |
          # etichetele cu sufix (v1.0.0-alpha.1) devin ciornă + pre-lansare; le publici tu după verificare
          tag="$TAG"
          case "$tag" in v[0-9]*) ;; *) echo "::error::eticheta trebuie să înceapă cu v și o cifră"; exit 1 ;; esac
          flags=""
          case "$tag" in *-*) flags="--draft --prerelease" ;; esac
          gh release create "$tag" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --generate-notes $flags
