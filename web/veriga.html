<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-XKC/HVLUn54oVFTHvYxO9F6+5foM7T1dz9B9umxyjr4=' 'sha256-o/Hdu5nxu/qzuFkJ8XYGutrRNZuXd0vcp5idZn8QDu0='; style-src-elem 'sha256-pT+CdiRMyfWnJaSujq6Rw3TLJ8X7EW7oun5DaBBlBFU='; style-src-attr 'unsafe-inline'; img-src data: blob:; connect-src http: https: blob: data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>VERIGA — verificator de legături</title>
<style>
:root{--bg:#f6f6f2;--fg:#1c1f23;--mut:#677079;--card:#fff;--bd:#d8dce1;--ok:#17794c;--bad:#b3261e;--warn:#98660a;--acc:#2f5fd0;--accfg:#fff;--row:#f1f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#e7e9ec;--mut:#98a0aa;--card:#1b1e23;--bd:#2c3138;--ok:#5ccf93;--bad:#ff8a80;--warn:#f0b84a;--acc:#86a8ff;--accfg:#10131a;--row:#20242a}}
*{box-sizing:border-box}
:root{color-scheme:light dark}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;background:var(--acc);color:var(--accfg);padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button,.btn,select,input[type=text],input[type=number],input[type=url],textarea{min-height:32px}
input[type=checkbox]{width:20px;height:20px;margin:2px 6px 2px 0}
.chk{display:flex;align-items:flex-start;gap:4px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.tab[aria-selected=true],.chip[aria-pressed=true]{outline:2px solid Highlight}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--card);flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem;letter-spacing:.08em}
header .sub{color:var(--mut);font-size:.85rem;flex:1}
main{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab,button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],textarea,select{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
textarea{min-height:70px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
.chk{display:flex;gap:7px;align-items:center;color:var(--fg);font-size:.9rem;margin:5px 0}
.chk input{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 18px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:22px;text-align:center;color:var(--mut)}
#drop.over{border-color:var(--acc);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.bar{height:8px;background:var(--row);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--mut);margin-top:8px}
.stats b{color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:3px 11px;font-size:.85rem}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
#tbl{height:56vh;min-height:280px;overflow:auto;border:1px solid var(--bd);border-radius:8px;position:relative;background:var(--card)}
#thead,.r{display:grid;grid-template-columns:170px 54px minmax(260px,1fr) 92px 78px 170px 40px 58px;gap:0;align-items:center;font-size:.85rem}
#thead{position:sticky;top:0;background:var(--row);z-index:2;border-bottom:1px solid var(--bd);min-width:960px}
#thead div{padding:6px 8px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
#spacer{position:relative;min-width:960px}
.r{position:absolute;left:0;right:0;height:28px;border-bottom:1px solid var(--bd);cursor:pointer}
.r:hover{background:var(--row)}.r.sel{background:var(--row);outline:2px solid var(--acc);outline-offset:-2px}
.r div{padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u{font-family:ui-monospace,Consolas,monospace;font-size:.8rem}
.s-bad{color:var(--bad);font-weight:600}.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-mut{color:var(--mut)}
#detail{margin-top:10px;font-size:.9rem}
#detail .par{display:block;color:var(--mut);font-size:.82rem;word-break:break-all}
a{color:var(--acc)}
.note{color:var(--mut);font-size:.82rem}
.hide{display:none!important}
details>summary{cursor:pointer;font-weight:600}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.85rem;margin:8px 0}
@media (max-width:700px){main{padding:8px}.card{padding:10px}}
</style>
</head>
<body>
<a class="skip" href="#main" data-ro="Sari la conținut" data-en="Skip to content"></a>
<header>
  <h1>VERIGA</h1>
  <span class="sub" data-ro="Verificator de legături — variantă HTML single-file, 100% în browser" data-en="Link checker — single-file HTML edition, 100% in the browser"></span>
  <button id="lang" title="RO / EN">EN</button>
</header>
<main id="main" tabindex="-1">
<section class="card" id="setup">
  <div class="tabs" role="tablist" id="tl-main" aria-label="Sursă / Source">
    <button class="tab" role="tab" id="tab-folder" aria-controls="p-folder" tabindex="0" data-mode="folder" aria-selected="true" data-ro="📁 Folder local" data-en="📁 Local folder"></button>
    <button class="tab" role="tab" id="tab-online" aria-controls="p-online" tabindex="-1" data-mode="online" aria-selected="false" data-ro="🌐 Site online" data-en="🌐 Online site"></button>
    <button class="tab" role="tab" id="tab-list" aria-controls="p-list" tabindex="-1" data-mode="list" aria-selected="false" data-ro="📋 Listă de URL-uri" data-en="📋 URL list"></button>
  </div>

  <div id="p-folder" role="tabpanel" aria-labelledby="tab-folder">
    <div id="drop">
      <div data-ro="Trage aici folderul site-ului (rădăcina) sau" data-en="Drop the site folder (root) here or"></div>
      <div style="margin-top:8px"><label class="btn" style="display:inline-block;margin:0;color:var(--fg)"><span data-ro="Alege folder…" data-en="Choose folder…"></span><input id="dir" type="file" webkitdirectory directory multiple hidden></label></div>
      <div id="dirinfo" class="note" style="margin-top:8px"></div>
    </div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="orph" checked><span data-ro="Caută fișiere orfane (la care nu duce niciun link)" data-en="Find orphan files (not linked from anywhere)"></span></label>
    <label class="chk"><input type="checkbox" id="caseck" checked><span data-ro="Semnalează diferențe de majuscule (linkul merge pe Windows/macOS, dar nu pe Linux)" data-en="Flag case mismatches (works on Windows/macOS, breaks on Linux)"></span></label>
    <label data-ro="Pagina de start (opțional; implicit index.html)" data-en="Start page (optional; default index.html)"></label>
    <input type="text" id="entry" placeholder="index.html">
  </div>

  <div id="p-online" role="tabpanel" aria-labelledby="tab-online" class="hide">
    <label data-ro="URL de start" data-en="Start URL"></label>
    <input type="text" id="url" placeholder="https://exemplu.ro/">
    <div class="warnbox" data-ro="Un browser nu poate citi codul HTTP al altor site-uri (politica CORS). Pentru rezultate complete: (1) deschide acest fișier de pe același site pe care îl verifici, (2) folosește un proxy CORS propriu (câmpul de mai jos) sau (3) folosește varianta nativă Rust. Fără acestea, linkurile externe sunt doar testate pentru accesibilitate." data-en="A browser cannot read the HTTP status of other sites (CORS policy). For complete results: (1) open this file from the same site you are checking, (2) use your own CORS proxy (field below), or (3) use the native Rust edition. Otherwise external links are only tested for reachability."></div>
    <label data-ro="Șablon proxy CORS (opțional), ex. https://proxy.exemplu.ro/?u={url}" data-en="CORS proxy template (optional), e.g. https://proxy.example.com/?u={url}"></label>
    <input type="text" id="proxy" placeholder="https://proxy.exemplu.ro/?u={url}">
  </div>

  <div id="p-list" role="tabpanel" aria-labelledby="tab-list" class="hide">
    <label data-ro="URL-uri de verificat (unul pe linie)" data-en="URLs to check (one per line)"></label>
    <textarea id="urls" placeholder="https://exemplu.ro/&#10;https://exemplu.ro/contact"></textarea>
    <label data-ro="Sau lipește sursa HTML a unei pagini" data-en="Or paste a page's HTML source"></label>
    <textarea id="html" placeholder="<a href=&quot;...&quot;>"></textarea>
    <label data-ro="URL de bază pentru sursa HTML lipită" data-en="Base URL for the pasted HTML"></label>
    <input type="text" id="base" placeholder="https://exemplu.ro/pagina.html">
  </div>

  <details style="margin-top:12px"><summary data-ro="⚙ Opțiuni" data-en="⚙ Options"></summary>
    <div class="grid">
      <div><label data-ro="Verificări simultane" data-en="Parallel checks"></label><input type="number" id="o-threads" value="12" min="1" max="64"></div>
      <div><label data-ro="Timeout (secunde)" data-en="Timeout (seconds)"></label><input type="number" id="o-timeout" value="20" min="2" max="120"></div>
      <div><label data-ro="Reîncercări" data-en="Retries"></label><input type="number" id="o-retries" value="1" min="0" max="5"></div>
      <div><label data-ro="Adâncime maximă (gol = nelimitat)" data-en="Max depth (empty = unlimited)"></label><input type="number" id="o-depth" min="0" max="50"></div>
      <div><label data-ro="Limită URL-uri" data-en="URL limit"></label><input type="number" id="o-max" value="20000" min="10"></div>
      <div><label data-ro="Coduri HTTP tratate ca OK (ex. 999)" data-en="HTTP codes treated as OK (e.g. 999)"></label><input type="text" id="o-ign" placeholder="999"></div>
    </div>
    <div class="grid" style="margin-top:6px">
      <label class="chk"><input type="checkbox" id="o-ext" checked><span data-ro="Verifică linkuri externe" data-en="Check external links"></span></label>
      <label class="chk"><input type="checkbox" id="o-res" checked><span data-ro="Verifică imagini / CSS / JS / media" data-en="Check images / CSS / JS / media"></span></label>
      <label class="chk"><input type="checkbox" id="o-mail" checked><span data-ro="Verifică mailto:" data-en="Check mailto:"></span></label>
      <label class="chk"><input type="checkbox" id="o-frag"><span data-ro="Verifică ancore #" data-en="Check #anchors"></span></label>
      <label class="chk"><input type="checkbox" id="o-forms"><span data-ro="Verifică acțiuni de formular" data-en="Check form actions"></span></label>
      <label class="chk"><input type="checkbox" id="o-red"><span data-ro="Redirecționările sunt erori" data-en="Treat redirects as errors"></span></label>
      <label class="chk"><input type="checkbox" id="o-403" checked><span data-ro="401/403 = «merită o a doua privire», nu link rupt" data-en="401/403 = “worth a second look”, not broken"></span></label>
      <label class="chk"><input type="checkbox" id="o-dir"><span data-ro="Rămâi în directorul de start" data-en="Stay in start directory"></span></label>
    </div>
    <div class="grid">
      <div><label data-ro="Exclude (regex, unul pe linie)" data-en="Exclude (regex, one per line)"></label><textarea id="o-excl"></textarea></div>
      <div><label data-ro="Verifică, dar nu parcurge (regex)" data-en="Check but don't follow (regex)"></label><textarea id="o-nofol"></textarea></div>
      <div><label data-ro="Gazde interne suplimentare" data-en="Extra internal hosts"></label><textarea id="o-hosts"></textarea></div>
    </div>
  </details>

  <div class="row" style="margin-top:14px">
    <button class="primary" id="b-start" data-ro="▶ Pornește" data-en="▶ Start"></button>
    <button id="b-pause" disabled data-ro="⏸ Pauză" data-en="⏸ Pause"></button>
    <button id="b-stop" disabled data-ro="■ Oprește" data-en="■ Stop"></button>
    <button id="b-recheck" disabled data-ro="↻ Reverifică rupte" data-en="↻ Recheck broken"></button>
    <label class="btn" style="margin:0;color:var(--fg)"><span data-ro="📂 Importă sesiune" data-en="📂 Import session"></span><input id="b-import" type="file" accept=".json,.veriga" hidden></label>
  </div>
</section>

<section class="card hide" id="prog">
  <div class="bar" role="progressbar" id="pbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-al-ro="Progres verificare" data-al-en="Check progress"><i id="bar"></i></div>
  <div class="stats" role="status" aria-live="off">
    <span><span data-ro="verificate" data-en="checked"></span>: <b id="c-done">0</b></span>
    <span><span data-ro="în coadă" data-en="queued"></span>: <b id="c-q">0</b></span>
    <span><span data-ro="rupte" data-en="broken"></span>: <b id="c-bad" class="s-bad">0</b></span>
    <span><span data-ro="timp" data-en="time"></span>: <b id="c-t">0s</b></span>
    <span id="c-phase"></span>
  </div>
</section>

<section class="card hide" id="res">
  <div class="row sp">
    <div class="chips" id="chips"></div>
    <div class="row">
      <input type="text" id="q" style="width:220px" data-ph-ro="Caută…" data-ph-en="Search…">
      <select id="exp" style="width:auto"></select>
    </div>
  </div>
  <div id="tbl" style="margin-top:10px"><div id="thead"></div><div id="spacer"></div></div>
  <div id="detail" class="note"></div>
  <div id="msg" class="note" role="status" aria-live="polite"></div>
</section>
<section class="card" id="gd">
  <details id="gd-det">
    <summary data-ro="🛡 Guardian — reparații, domenii, hartă de sănătate, tendințe, 404, conformitate" data-en="🛡 Guardian — fixes, domains, health map, trends, 404s, compliance"></summary>
    <div class="tabs" id="gd-tabs" role="tablist" aria-label="Guardian" style="margin-top:12px"></div>
    <div id="gd-body" role="tabpanel" tabindex="0" aria-live="polite"></div>
  </details>
</section>
</main>

<script>
'use strict';
/* ───────────── utilitare ───────────── */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let LANG = ((navigator.language || 'ro') + '').toLowerCase().startsWith('en') ? 'en' : 'ro';
const T = (ro, en) => LANG === 'en' ? en : ro;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
const humanSize = n => { if (n == null) return ''; const u = ['B','KB','MB','GB']; let i = 0, v = n; while (v >= 1024 && i < 3) { v /= 1024; i++; } return i ? v.toFixed(1) + ' ' + u[i] : n + ' B'; };
const siteKey = h => String(h || '').toLowerCase().replace(/^www\./, '');
const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ───────────── stări și etichete (identice cu motorul Rust) ───────────── */
const ST = {
  Pending:['În așteptare','Pending'], Ok:['OK','OK'], Redirected:['Redirecționat','Redirected'],
  NotFound:['Nu există (404)','Not found (404)'], Forbidden:['Acces interzis','Forbidden'],
  ClientError:['Eroare client (4xx)','Client error (4xx)'], ServerError:['Eroare server (5xx)','Server error (5xx)'],
  Timeout:['Timp depășit','Timeout'], NoConnection:['Fără conexiune','No connection'],
  DnsFailure:['Gazdă inexistentă (DNS)','DNS failure'], TlsError:['Eroare TLS/certificat','TLS/certificate error'],
  TooManyRedirects:['Prea multe redirecționări','Too many redirects'], BadRedirect:['Redirecționare invalidă','Bad redirect'],
  InvalidUrl:['URL invalid','Invalid URL'], InvalidEmail:['E-mail invalid','Invalid e-mail'],
  LocalMissing:['Fișier local lipsă','Local file missing'], FragmentMissing:['Ancoră lipsă','Anchor missing'],
  FtpError:['Eroare FTP','FTP error'], RobotsBlocked:['Blocat de robots.txt','Blocked by robots.txt'],
  Skipped:['Omis / neverificabil','Skipped / unverifiable'], Orphan:['Fișier orfan','Orphan file']
};
const ERR = new Set(['NotFound','Forbidden','ClientError','ServerError','Timeout','NoConnection','DnsFailure','TlsError','TooManyRedirects','BadRedirect','InvalidUrl','InvalidEmail','LocalMissing','FragmentMissing','FtpError']);
const KIND = {
  Start:['Start','Start'], Page:['Pagină','Page'], Image:['Imagine','Image'], Stylesheet:['Stil CSS','Stylesheet'], Script:['Script','Script'],
  Frame:['Cadru','Frame'], Media:['Media','Media'], Object:['Obiect','Object'], Form:['Formular','Form'], Icon:['Pictogramă','Icon'],
  Link:['Legătură <link>','<link>'], Anchor:['Ancoră','Anchor'], Mailto:['E-mail','E-mail'], Ftp:['FTP','FTP'], File:['Fișier','File'],
  Sitemap:['Sitemap','Sitemap'], Other:['Altele','Other']
};
const stLabel = s => (ST[s] || [s, s])[LANG === 'en' ? 1 : 0];
const kindLabel = k => (KIND[k] || [k, k])[LANG === 'en' ? 1 : 0];

/* ───────────── starea aplicației ───────────── */
const S = {
  mode: 'folder', cfg: null, results: [], index: new Map(), queue: [], inflight: 0, hostBusy: new Map(),
  running: false, paused: false, cancelled: false, pump: null, abort: null, done: 0, broken: 0, ignored: 0, truncated: false,
  anchors: new Map(), fragments: [], startUrls: [], internalHosts: new Set(), dirPrefixes: [],
  started: null, t0: 0,
  // folder
  files: new Map(), filesLower: new Map(), dirs: new Set(), rootName: '', rootPrefix: '',
  view: [], filter: 'all', sort: 'order', desc: false, selected: -1, q: ''
};

/* ───────────── configurație ───────────── */
function readCfg() {
  const n = (id, d) => { const v = parseInt($(id).value, 10); return isNaN(v) ? d : v; };
  const c = {
    threads: Math.max(1, n('#o-threads', 12)), timeout: Math.max(2, n('#o-timeout', 20)), retries: Math.max(0, n('#o-retries', 1)),
    maxDepth: $('#o-depth').value === '' ? null : n('#o-depth', 5), maxUrls: n('#o-max', 20000),
    ignoreStatus: ($('#o-ign').value.match(/\d+/g) || []).map(Number),
    checkExternal: $('#o-ext').checked, checkResources: $('#o-res').checked, checkMailto: $('#o-mail').checked,
    checkFragments: $('#o-frag').checked, checkForms: $('#o-forms').checked, redirectsAsErrors: $('#o-red').checked,
    stayInDir: $('#o-dir').checked, reviewForbidden: $('#o-403').checked,
    exclude: [], noFollow: [], internalHosts: lines($('#o-hosts').value).map(siteKey),
    proxy: $('#proxy').value.trim(), orphans: $('#orph').checked, caseCheck: $('#caseck').checked
  };
  for (const [k, id] of [['exclude', '#o-excl'], ['noFollow', '#o-nofol']]) {
    for (const p of lines($(id).value)) { try { c[k].push(new RegExp(p)); } catch (e) { throw new Error(T('Expresie regulată invalidă: ', 'Invalid regular expression: ') + p); } }
  }
  return c;
}
const isReview = st => st === 'Forbidden' && !!(S.cfg ? S.cfg.reviewForbidden : true);
const isBroken = st => isReview(st) ? false : (ERR.has(st) || (S.cfg && S.cfg.redirectsAsErrors && st === 'Redirected'));

/* ───────────── extragere linkuri din DOM ───────────── */
const CSS_URL = /url\(\s*(?:"([^"]*)"|'([^']*)'|([^)\s'"]+))\s*\)/gi;
const CSS_IMPORT = /@import\s+(?:"([^"]+)"|'([^']+)')/gi;
const BAD_SCHEME = /^(javascript:|data:|tel:|sms:|blob:|about:|whatsapp:)/i;

function cssLinks(css, push, defKind) {
  let m;
  CSS_IMPORT.lastIndex = 0;
  while ((m = CSS_IMPORT.exec(css))) push(m[1] || m[2], 'Stylesheet', '');
  CSS_URL.lastIndex = 0;
  while ((m = CSS_URL.exec(css))) {
    const before = css.slice(Math.max(0, m.index - 8), m.index).toLowerCase().trim();
    push(m[1] || m[2] || m[3], before.endsWith('@import') ? 'Stylesheet' : defKind, '');
  }
}

function extractDoc(doc, pageUrl, cfg) {
  const out = { title: null, h1: null, links: [], bad: [], anchors: new Set() };
  let base = pageUrl;
  const b = doc.querySelector('base[href]');
  if (b) { try { base = resolveRaw(b.getAttribute('href'), pageUrl).href; } catch (e) {} }
  const push = (raw, kind, text) => {
    raw = (raw || '').trim();
    if (!raw || BAD_SCHEME.test(raw) || /\{\{|<%|\$\{/.test(raw)) return;
    try { out.links.push({ url: resolveRaw(raw, base), kind, text: trunc(text, 120) }); }
    catch (e) { out.bad.push([raw, kind, T('URL ilizibil', 'Unreadable URL')]); }
  };
  const srcset = (v, kind) => { v = (v || '').trim(); if (v.startsWith('data:')) return; v.split(',').forEach(p => { const u = p.trim().split(/\s+/)[0]; if (u) push(u, kind, ''); }); };
  const t = doc.querySelector('title');

  if (fixes.length) { o += `<h2>${gl('Reparații', 'Fixes')}</h2><table><tr><th>${gl('Data', 'Date')}</th><th>${gl('Regulă', 'Rule')}</th><th>${gl('Înainte', 'Before')}</th><th>${gl('După', 'After')}</th></tr>` + fixes.slice(-500).reverse().map(e => `<tr><td>${esc(e.time)}</td><td>${esc(ruleLabel(e.rule))}</td><td class="u">${esc(e.old)}</td><td class="u">${esc(e.new)}</td></tr>`).join('') + '</table>'; }

  return o + '</main></body></html>';
}
function guardianHtml() {
  const sn = snapshot(); let o = `<!doctype html><html lang="${LANG}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"><meta name="color-scheme" content="light dark"><title>VERIGA Guardian</title><style>${REPORT_CSS}</style></head><body><main><h1>VERIGA Guardian</h1><p class="par">${esc(sn.start)}</p>`;
  o += `<div class="cards"><div class="card"><b>${sn.total}</b>${gl('verificate', 'checked')}</div><div class="card bad"><b>${sn.broken}</b>${gl('rupte', 'broken')}</div><div class="card"><b>${sn.review}</b>403</div><div class="card"><b>${sn.redirects}</b>${gl('redirecționate', 'redirected')}</div><div class="card ok"><b>${sn.health.toFixed(1)}%</b>${gl('sănătate', 'health')}</div></div>`;
  if (GD.prev) { const d = sessDiff(GD.prev, S.results); o += `<h2>${gl('Față de rularea anterioară', 'Since previous run')}</h2><p>${gl('noi rupte', 'newly broken')}: <b>${d.nu.length}</b> · ${gl('rezolvate', 'resolved')}: <b>${d.resolved.length}</b> · ${gl('derivă de conținut', 'content drift')}: <b>${d.drift.length}</b></p>`; }
  o += `<h2>${gl('Tendințe', 'Trends')}</h2>${trendSvg(histLoad())}<h2>${gl('După domeniu', 'By domain')}</h2><table><tr><th>${gl('Gazdă', 'Host')}</th><th>Total</th><th>${gl('Rupte', 'Broken')}</th><th>403</th><th>ms</th><th>${gl('Sănătate', 'Health')}</th></tr>` + domainStats().slice(0, 300).map(d => `<tr><td>${esc(d.host)}</td><td>${d.total}</td><td>${d.broken}</td><td>${d.review}</td><td>${d.avg}</td><td>${d.health.toFixed(0)}%</td></tr>`).join('') + '</table>';
  o += `<h2>${gl('Harta de sănătate', 'Health map')}</h2><table><tr><th>${gl('Pagină', 'Page')}</th><th>${gl('Linkuri', 'Links')}</th><th>${gl('Rupte', 'Broken')}</th><th>${gl('Scor', 'Score')}</th></tr>` + healthMap().slice(0, 500).map(p => `<tr><td class="u">${esc(p.page)}<span class="par">${esc(p.title || '')}</span></td><td>${p.links}</td><td>${p.broken}</td><td>${p.score.toFixed(0)}%</td></tr>`).join('') + '</table>';
  o += `<h2>${gl('Vedere «carte»', 'Book view')}</h2>` + healthMap().filter(p => p.items.length).slice(0, 300).map(p => `<details><summary>${esc(p.title || p.page)} — ${p.items.length}</summary><table>` + p.items.map(i => `<tr><td>${esc(i.text)}</td><td class="u">${esc(i.url)}</td><td>${esc(stLabel(i.status))}<span class="par">${esc(i.message || '')}</span></td></tr>`).join('') + '</table></details>').join('');
  return o + '</main></body></html>';
}

const GD_TABS = [['fix', 'Reparații', 'Fixes'], ['log', 'Jurnal / anulare', 'Log / undo'], ['dom', 'Domenii', 'Domains'], ['health', 'Hartă / carte', 'Health / book'], ['redir', 'Redirecționări', 'Redirects'], ['trend', 'Tendințe', 'Trends'], ['l404', '404 din jurnal', '404 from logs'], ['comp', 'Conformitate', 'Compliance']];

const needSess = () => S.results.length ? '' : `<p class="note">${gl('Rulează sau importă mai întâi o verificare.', 'Run or import a check first.')}</p>`;

    h += `<label class="chk"><input type="checkbox" id="gd-upg" ${GD.upgrade ? 'checked' : ''}><span>${gl('Propune https:// pentru orice http:// (doar dacă https răspunde la aceeași resursă)', 'Propose https:// for any http:// (only if https answers with the same resource)')}</span></label>`;
    h += `<label class="chk"><input type="checkbox" id="gd-verify" ${GD.verify ? 'checked' : ''}><span>${gl('Verifică live URL-ul nou (limitat de CORS; ce nu se poate citi rămâne neverificat și nu se aplică automat)', 'Verify new URL live (CORS-limited; unreadable stays unverified and is not auto-applied)')}</span></label>`;

  } else if (GD.tab === 'log') {
    if (GD.log.some(e => e.imported)) h += `<div class="warnbox"><label class="chk"><input type="checkbox" id="gd-trust" ${GD.trust ? 'checked' : ''}><span>${gl('Am verificat jurnalul importat: anularea scrie în fișiere textele „înainte” din jurnal.', 'I reviewed the imported log: undo writes the log’s “before” texts into the files.')}</span></label></div>`;
    h += `<div class="row"><button id="gd-undo-last">${gl('↶ Anulează ultima rulare', '↶ Undo last run')}</button><button id="gd-lcsv">${gl('CSV jurnal', 'Log CSV')}</button><button id="gd-ljson">${gl('Descarcă jurnal (.json)', 'Download log (.json)')}</button><label class="btn" style="margin:0;color:var(--fg)">${gl('Importă jurnal', 'Import log')}<input id="gd-limp" type="file" accept=".json" hidden></label><span class="note">${esc(GD.msg)}</span></div><p class="note">${gl('Pentru a anula o rulare dintr-o sesiune anterioară: importă jurnalul, încarcă fișierele modificate (tab Reparații) și apasă anulare.', 'To undo a run from an earlier session: import the log, load the modified files (Fixes tab) and press undo.')}</p>`;
    h += tbl(['Run', gl('Regulă', 'Rule'), gl('Stare', 'Status'), gl('Modificare', 'Change'), ''], [...GD.log].reverse().map(e => `<tr>${td(esc(e.run))}${td(esc(ruleLabel(e.rule)))}${td(esc(String(e.status)))}${td(esc(e.old) + '<br>→ ' + esc(e.new), 'u')}${td(e.status === 'Applied' ? `<button data-undo="${esc(e.id)}">↶</button>` : '')}</tr>`));

  } else if (GD.tab === 'health') {
    h += needSess() || healthMap().slice(0, 400).map(p => p.items.length ? `<details><summary>${p.score.toFixed(0)}% · ${p.broken}/${p.links} — ${esc(p.title || p.page)}</summary>${p.items.map(i => `<div class="u">${i.review ? '⚠' : '✖'} [${esc(stLabel(i.status))}] ${esc(i.url)}</div>`).join('')}</details>` : `<div>${p.score.toFixed(0)}% · 0/${p.links} — ${esc(p.title || p.page)}</div>`).join('');
  } else if (GD.tab === 'redir') {
    h += needSess() || tbl([gl('De la', 'From'), gl('La', 'To'), gl('Tip', 'Type'), gl('Pagini', 'Pages')], redirectsList().map(r => `<tr>${td(esc(r.from), 'u')}${td(esc(r.to), 'u')}${td(r.codes.join('→') + ' ' + (r.perm ? gl('permanent', 'permanent') : gl('temporar', 'temporary')))}${td(r.pages)}</tr>`));
  } else if (GD.tab === 'trend') {
    const hist = histLoad();
    h += `<div class="row"><button id="gd-rec" ${S.results.length ? '' : 'disabled'}>${gl('＋ Înregistrează rularea curentă', '＋ Record current run')}</button><label class="btn" style="margin:0;color:var(--fg)">${gl('Încarcă sesiune anterioară', 'Load previous session')}<input id="gd-prev" type="file" accept=".json,.veriga" hidden></label><button id="gd-gh" ${S.results.length ? '' : 'disabled'}>${gl('Raport Guardian (HTML)', 'Guardian report (HTML)')}</button><button id="gd-hclr">${gl('Șterge istoricul', 'Clear history')}</button></div>`;
    if (GD.prev && S.results.length) { const d = sessDiff(GD.prev, S.results); h += `<p>${gl('noi rupte', 'newly broken')}: <b>${d.nu.length}</b> · ${gl('rezolvate', 'resolved')}: <b>${d.resolved.length}</b> · ${gl('derivă de conținut', 'content drift')}: <b>${d.drift.length}</b></p>` + d.drift.map(x => `<div class="u">${esc(x.url)}<span class="par">${esc((x.o.title || '') + ' | ' + (x.o.h1 || ''))} → ${esc((x.n.title || '') + ' | ' + (x.n.h1 || ''))}</span></div>`).join(''); }
    h += trendSvg(hist) + tbl([gl('Data', 'Date'), 'Total', gl('Rupte', 'Broken'), gl('Sănătate', 'Health')], [...hist].reverse().map(x => `<tr>${td(esc(x.time))}${td(x.total)}${td(x.broken)}${td(x.health.toFixed(1) + '%')}</tr>`));

async function gdLoadFiles(list) {
  for (const f of list) { if (f.size > 20e6) continue; const rel = f.webkitRelativePath || f.name; const k = gDetect(rel, ''); const txt = await f.text(); if (!k && !(rel.toLowerCase().endsWith('.xml'))) continue; GD.files.set(rel, { text: txt, backup: null, dirty: false }); }
  GD.msg = GD.files.size + gl(' fișiere încărcate', ' files loaded'); gdRender();
}
function gdDownloadModified() { for (const [n, f] of GD.files) if (f.dirty) download(n.split('/').pop(), 'text/plain', f.text); }
async function gdWriteFolder() {
  try { const root = await window.showDirectoryPicker({ mode: 'readwrite' }); let n = 0;
    for (const [rel, f] of GD.files) { if (!f.dirty) continue; const parts = rel.split('/'); if (parts.length > 1) parts.shift(); let dir = root; for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(p); const fh = await dir.getFileHandle(parts[parts.length - 1]); const w = await fh.createWritable(); await w.write(f.text); await w.close(); n++; }
    GD.msg = n + gl(' fișiere scrise', ' files written'); } catch (e) { GD.msg = String(e.message || e); } gdRender();
}
document.addEventListener('DOMContentLoaded', () => {
  gLoadLog(); gdRender();
  $('#gd-tabs').addEventListener('click', e => { const b = e.target.closest('[data-gt]'); if (b) { GD.tab = b.dataset.gt; GD.msg = ''; gdRender(); } });
  const body = $('#gd-body');
  body.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'gd-files' || t.id === 'gd-dir') { await gdLoadFiles([...t.files]); t.value = ''; }
    else if (t.id === 'gd-verify') GD.verify = t.checked;
    else if (t.id === 'gd-upg') GD.upgrade = t.checked;
    else if (t.id === 'gd-trust') { GD.trust = t.checked; gdRender(); }
    else if (t.dataset && t.dataset.ps) { t.checked ? GD.sel.add(t.dataset.ps) : GD.sel.delete(t.dataset.ps); gdRender(); }
    else if (t.id === 'gd-limp') { try { GD.log = gSanitizeLog(JSON.parse(await t.files[0].text())); GD.trust = false; gSaveLog(); GD.msg = GD.log.length + gl(' intrări (importate — bifează confirmarea înainte de anulare)', ' entries (imported — tick the confirmation before undoing)'); } catch (er) { GD.msg = gl('Jurnal invalid.', 'Invalid log.'); } gdRender(); }
    else if (t.id === 'gd-prev') { try { GD.prev = JSON.parse(await t.files[0].text()); } catch (er) { GD.prev = null; } gdRender(); }
    else if (t.id === 'gd-log') {
      const txt = await t.files[0].text(); const known = [...new Set(S.results.filter(r => !isBroken(r.status)).map(r => { try { return new URL(r.url).pathname; } catch (er) { return null; } }).filter(Boolean))];
      GD.hits = parse404(txt, !$('#gd-bots').checked, known); GD.msg = GD.hits.length + ' 404'; gdRender();
    } else if (t.id === 'gd-days') GD.days = Math.max(1, parseInt(t.value, 10) || 30);
  });
  body.addEventListener('click', async e => {
    const id = e.target.id; const un = e.target.closest('[data-undo]');
    if (un) { const r = gUndo([un.dataset.undo]); GD.msg = gl('Anulate: ', 'Undone: ') + r.undone + gl(' · conflicte: ', ' · conflicts: ') + r.conflicts; gdRender(); return; }
    if (id === 'gd-scan') { GD.msg = gl('Scanez și verific…', 'Scanning and verifying…'); gdRender(); GD.props = await gPropose(); GD.sel = new Set(GD.props.filter(p => p.verified).map(p => p.id)); GD.msg = GD.props.length + gl(' propuneri', ' proposals'); gdRender(); }
    else if (id === 'gd-madd') { const o = $('#gd-mo').value.trim(), n = $('#gd-mn').value.trim(); if (o) { const add = gManual(o, n); add.forEach(p => { p.id = 'x' + (GD.props.length + 1); GD.props.push(p); GD.sel.add(p.id); }); gdRender(); } }
    else if (id === 'gd-selv') { GD.sel = new Set(GD.props.filter(p => p.verified).map(p => p.id)); gdRender(); }
    else if (id === 'gd-apply') { const r = gApply(GD.props.filter(p => GD.sel.has(p.id)), gRun()); GD.msg = gl('Aplicate: ', 'Applied: ') + r.applied + gl(' · omise: ', ' · skipped: ') + r.skipped.length; GD.props = []; GD.sel = new Set(); gdRender(); }
    else if (id === 'gd-pcsv') download('propuneri.csv', 'text/csv', gCsv([['id', 'file', 'page', 'rule', 'old', 'new', 'verified', 'impact', 'pages', 'note'], ...GD.props.map(p => [p.id, p.file, p.page, p.rule, p.old, p.new, p.verified ? 'da' : 'nu', gImpact(p) ? 'da' : 'nu', p.pages, p.note])]));
    else if (id === 'gd-dl') gdDownloadModified();
    else if (id === 'gd-write') gdWriteFolder();
    else if (id === 'gd-undo-last') { const last = [...GD.log].reverse().find(x => x.status === 'Applied'); if (last) { const r = gUndo(null, last.run); GD.msg = gl('Anulate: ', 'Undone: ') + r.undone + gl(' · conflicte: ', ' · conflicts: ') + r.conflicts; gdRender(); } }
    else if (id === 'gd-lcsv') download('jurnal-reparatii.csv', 'text/csv', gCsv([['id', 'run', 'time', 'file', 'rule', 'old', 'new', 'status'], ...GD.log.map(x => [x.id, x.run, x.time, x.file, x.rule, x.old, x.new, x.status])]));
    else if (id === 'gd-ljson') download('veriga-fixlog.json', 'application/json', JSON.stringify(GD.log, null, 1));
    else if (id === 'gd-rec') { const h = histLoad(); h.push(snapshot()); lsSet('veriga.history', JSON.stringify(h.slice(-1000))); gdRender(); }
    else if (id === 'gd-hclr') { lsSet('veriga.history', '[]'); gdRender(); }
    else if (id === 'gd-gh') download('guardian.html', 'text/html', guardianHtml());
    else if (id === 'gd-hcsv') download('404.csv', 'text/csv', gCsv([['path', 'count', 'last', 'top_referer', 'suggested_redirect'], ...GD.hits.map(x => [x.path, x.count, x.last, (x.referers[0] || [''])[0], x.suggestion || ''])]));
    else if (id === 'gd-hta') download('redirect.htaccess', 'text/plain', '# generat de VERIGA — verificați înainte de a folosi\n' + GD.hits.filter(x => x.suggestion && /^[\x21-\x7e]+$/.test(x.path.split('?')[0])).map(x => `Redirect 301 ${x.path.split('?')[0]} ${x.suggestion}`).join('\n') + '\n');
    else if (id === 'gd-cr') download('conformitate.html', 'text/html', complianceHtml(GD.days));
    else if (id === 'gd-cra') download('conformitate.html', 'text/html', complianceHtml(0));
  });
  $('#lang').addEventListener('click', () => setTimeout(gdRender, 0));
  $('#gd-det').addEventListener('toggle', gdRender);
});
