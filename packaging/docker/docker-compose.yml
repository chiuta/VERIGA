# Verificare periodică cu imaginea oficială (GHCR). Pornire:  docker compose run --rm veriga check https://example.org
# Mod programat (Guardian):  cp -r data.example data && sudo chown -R 65532 data  # editează data/guardian.json, apoi:
#                            docker compose --profile guardian up -d guardian
services:
  veriga:
    image: ghcr.io/chiuta/veriga:latest
    profiles: ["cli"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/data
  guardian:
    image: ghcr.io/chiuta/veriga:latest
    profiles: ["guardian"]   # nu pornește fără data/guardian.json (altfel ar intra în buclă de crash)
    restart: on-failure:5
    # `watch` fără --once rulează la fiecare every_hours din fișierul de configurare
    command: ["watch", "--config", "/data/guardian.json"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/data        # aici: guardian.json + starea (state: "/data/state")
